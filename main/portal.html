<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PearlPod WiFi</title><style>body{background:#101827;color:#fff6dc;font:18px system-ui;max-width:32rem;margin:auto;padding:24px}h1{color:#ffd75e}label{display:block;margin:20px 0 8px}input,select,button{box-sizing:border-box;width:100%;font:inherit;min-height:52px;border-radius:12px;padding:12px}button{background:#ffd75e;border:0;margin-top:18px}small{display:block;margin:12px 0;color:#56ddc5}#status{white-space:pre-wrap}a{color:#56ddc5}</style><h1>PearlPod WiFi</h1><p>Set up a network for later adventures. Music stays on the card.</p><p id="status" role="status">Loading…</p><button id="scan">Find networks</button><label for="networks">Nearby networks</label><select id="networks"><option value="">Choose or enter one below</option></select><form id="form"><label for="ssid">Network name (including hidden networks)</label><input id="ssid" maxlength="32" required autocomplete="off"><label for="password">WiFi password</label><input id="password" type="password" maxlength="63" autocomplete="new-password"><small>Enter the password when saving a network. Leave it empty for an open network.</small><button>Save and connect</button></form><small>Saved networks stay on PearlPod. Turn WiFi off from the player when finished.</small><script>
const $=id=>document.getElementById(id);async function command(path,data={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error(await r.text());}
async function refresh(){try{const r=await fetch('/state',{cache:'no-store'});if(!r.ok)throw Error('Setup session closed');const s=await r.json();$('status').textContent=s.message+(s.ip?'\nConnected: '+s.ip:'')+(s.saved.length?'\nSaved: '+s.saved.join(', '):'');const previous=$('networks').value;$('networks').replaceChildren(new Option(s.scanning?'Scanning…':'Choose or enter one below',''));s.networks.forEach(n=>$('networks').add(new Option(n.ssid+' · '+n.rssi+' dBm'+(n.secure?' · secured':''),n.ssid)));$('networks').value=previous;$('scan').disabled=s.scanning;}catch(e){$('status').textContent=e.message;}}
$('networks').onchange=()=>{$('ssid').value=$('networks').value;};$('scan').onclick=async()=>{try{await command('/scan');await refresh();}catch(e){$('status').textContent=e.message;}};$('form').onsubmit=async e=>{e.preventDefault();try{await command('/save',{ssid:$('ssid').value,password:$('password').value});$('password').value='';await refresh();}catch(e){$('status').textContent=e.message;}};refresh();setInterval(refresh,2000);
</script></html>
